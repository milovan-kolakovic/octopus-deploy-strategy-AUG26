.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--muted);padding:8px 13px;border-radius:7px;white-space:nowrap;border:1px solid transparent;transition:.15s;cursor:pointer}
.tab:hover{color:var(--bone);background:var(--concrete)}
.tab.active{color:var(--asphalt);background:var(--blue);font-weight:700}
.tab .n{opacity:.6;margin-right:6px}
.tab.active .n{opacity:.8}
/* ---------- SPA views ---------- */
.view{display:none}
.view.on{display:block}
/* ---------- section scaffolding ---------- */
.seckick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.28em;color:var(--blue);font-weight:700;text-transform:uppercase;margin-top:52px}
h2.sec{font-family:'Archivo Black',sans-serif;font-size:25px;margin:6px 0 8px;letter-spacing:-.3px}
h3.sub{font-family:'Archivo Black',sans-serif;font-size:17px;margin:30px 0 6px;letter-spacing:-.2px}
.lead{color:var(--chalk);font-size:15px;max-width:880px;margin:6px 0 18px}
.lead b{color:var(--bone)}
/* ---------- hero ---------- */
.hero{background:linear-gradient(155deg,#0A0A0C 0%,#101019 55%,#15151A 100%);border-bottom:1px solid var(--border);padding:54px 0 46px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-150px;top:-130px;width:480px;height:480px;background:radial-gradient(circle,rgba(27,155,209,.16),transparent 65%)}
.hero .wrap{position:relative;z-index:1}
.hk{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;color:#1B9BD1;font-weight:700}
.htitle{font-family:'Archivo Black',sans-serif;font-size:52px;line-height:1.02;margin:12px 0 4px;color:#F4F1EA}
.htitle .c{color:#D4FF3D}
.hsub{font-size:19px;color:#5BB8E0;margin-top:12px;border-top:2px solid #1B9BD1;padding-top:12px;display:inline-block;max-width:820px}
.hsub b{color:#F4F1EA}
.hmeta{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#8A8A95;margin-top:16px;letter-spacing:.04em}
/* ---------- generic cards ---------- */
.grid{display:flex;flex-wrap:wrap;gap:14px}
.g2>*{flex:1 1 calc(50% - 7px)}.g3>*{flex:1 1 calc(33.333% - 10px)}.g4>*{flex:1 1 calc(25% - 11px)}
.card{background:var(--concrete);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.card h4{font-family:'Archivo Black',sans-serif;font-size:15px;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--chalk)}
.card.acc-blue{border-top:3px solid var(--blue)}.card.acc-canopy{border-top:3px solid var(--canopy)}
.card.acc-moss{border-top:3px solid var(--moss)}.card.acc-terra{border-top:3px solid var(--terra)}.card.acc-clay{border-top:3px solid var(--clay)}
.card.acc-hazard{border-top:3px solid var(--hazard)}
/* ---------- callouts ---------- */
.callout{background:var(--asphalt);border:1px solid var(--border);border-left:5px solid var(--canopy);border-radius:12px;padding:22px 26px;margin-top:18px}
.callout .l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:#D4FF3D;text-transform:uppercase;margin-bottom:8px}
.callout p{font-size:18px;font-weight:600;color:#F4F1EA;line-height:1.42}
.callout.warn{border-left-color:var(--hazard)}
.callout.warn .l{color:#FF8A5C}
.note{background:var(--concrete);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:11px;padding:16px 20px;margin-top:16px;font-size:13.5px;color:var(--chalk)}
.note b{color:var(--bone)}
.note.hz{border-left-color:var(--hazard)}
.note.cn{border-left-color:var(--canopy)}
/* ---------- pills / badges ---------- */
.pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:5px;text-transform:uppercase;display:inline-block;white-space:nowrap}
.p-moss{background:var(--moss);color:#fff}.p-rust{background:var(--rust);color:#fff}.p-clay{background:var(--clay);color:var(--asphalt)}
.p-blue{background:var(--blue);color:#fff}.p-canopy{background:var(--canopy);color:var(--asphalt)}.p-gray{background:var(--court);color:var(--muted);border:1px solid var(--border2)}
.p-hazard{background:var(--hazard);color:#fff}.p-terra{background:var(--terra);color:#fff}
/* ---------- tables ---------- */
.tscroll{overflow-x:auto;margin-top:10px;border-radius:10px}
table.grid-t{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--concrete);border-radius:10px;overflow:hidden;min-width:560px}
table.grid-t th{background:var(--court);color:var(--bone);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:11px 14px;font-weight:700}
table.grid-t td{padding:11px 14px;border-top:1px solid var(--border);color:var(--chalk);vertical-align:top}
table.grid-t td b{color:var(--bone)}
table.grid-t tr.bad td{background:rgba(255,90,31,.06)}
table.grid-t tr.good td{background:rgba(123,170,62,.07)}
/* ---------- story arc ---------- */
.arc{display:flex;align-items:stretch;gap:0;margin-top:18px;flex-wrap:wrap}
.arcstep{flex:1;min-width:150px;background:var(--concrete);border:1px solid var(--border);border-radius:11px;padding:15px;position:relative}
.arcstep .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);font-weight:700}
.arcstep h4{font-size:14.5px;margin:6px 0 4px;color:var(--bone)}
.arcstep p{font-size:12.5px;color:var(--muted)}
.arcarrow{display:flex;align-items:center;color:var(--blue);font-size:20px;padding:0 4px}
/* ---------- move cards ---------- */
.mod{display:block;background:var(--concrete);border:1px solid var(--border);border-radius:13px;padding:20px 22px;transition:.16s;position:relative;overflow:hidden;cursor:pointer}
.mod:hover{border-color:var(--blue);transform:translateY(-2px)}
.mod .tagn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);letter-spacing:.12em}
.mod h3{font-family:'Archivo Black',sans-serif;font-size:18px;margin:7px 0 8px;color:var(--bone);line-height:1.2}
.mod p{font-size:13.5px;color:var(--chalk);margin-bottom:14px}
.mod .open{font-family:'JetBrains Mono',monospace;font-size:12px;color:#D4FF3D;font-weight:700}
.mod .open::after{content:" \2192"}
/* ---------- key numbers band ---------- */
.band{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}.band>*{flex:1 1 calc(25% - 11px)}
.stat{background:var(--court2);border:1px solid var(--border);border-radius:11px;padding:16px;text-align:center}
.stat .v{font-family:'Archivo Black',sans-serif;font-size:26px;color:#D4FF3D;line-height:1}
.stat .v.hz{color:#FF8A5C}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--blue-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}

  var VIEWS=['summary','constraint','audience','messaging','build'], DEFAULT='summary';
  var routed=false;
  function b2a(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}

  function showView(name){
    if(VIEWS.indexOf(name)===-1)name=DEFAULT;
    var t=document.getElementById('view-'+name);
    if(!t){name=DEFAULT;t=document.getElementById('view-'+DEFAULT)}
    if(!t)return;
    VIEWS.forEach(function(v){var el=document.getElementById('view-'+v);if(el)el.classList.toggle('on',v===name)});
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-view')===name)});
    window.scrollTo(0,0);
  }
  function initRouter(){
    if(routed)return; routed=true;
    document.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click',function(e){e.preventDefault();var v=t.getAttribute('data-view');
        if(window.location.hash!=='#'+v){window.location.hash=v}else{showView(v)}})});
    document.querySelectorAll('[data-goto]').forEach(function(el){
      el.addEventListener('click',function(e){e.preventDefault();var v=el.getAttribute('data-goto');
        if(window.location.hash!=='#'+v){window.location.hash=v}else{showView(v)}})});
    var bm=document.querySelector('.brandmark');
    if(bm)bm.addEventListener('click',function(e){e.preventDefault();
      if(window.location.hash!=='#summary'){window.location.hash='summary'}else{showView('summary')}});
    window.addEventListener('hashchange',function(){showView((window.location.hash||'').replace('#',''))});
    showView((window.location.hash||'').replace('#',''));
  }

  function unlock(html){
    document.getElementById('app').innerHTML=html;
    document.getElementById('app').classList.add('ready');
    document.getElementById('gate').style.display='none';
    document.body.classList.remove('locked');
    initRouter();
  }

  function derive(pw){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b2a(S),iterations:ITER,hash:'SHA-256'},k,
        {name:'AES-GCM',length:256},false,['decrypt'])});

  function attempt(pw){
    return derive(pw).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(D))
    }).then(function(buf){return new TextDecoder().decode(buf)});

  var f=document.getElementById('gform'),inp=document.getElementById('gpw'),
      btn=document.getElementById('gbtn'),err=document.getElementById('gerr');

  f.addEventListener('submit',function(e){
    e.preventDefault();
    var pw=inp.value.trim();
    if(!pw){err.textContent='Enter the password.';return}

    attempt(pw).then(function(html){
      try{sessionStorage.setItem('od_k',pw)}catch(_){}
      unlock(html);

      btn.disabled=false;btn.textContent='Open the blueprint';
      err.textContent='Incorrect password.';
      inp.value='';inp.focus();

  inp.focus();
